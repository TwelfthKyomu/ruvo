<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ruvo</title>
    <style>
        :root {
            --bg: #f7f7f5;
            --panel: #ffffff;
            --text: #1d1d1f;
            --muted: #6e6e73;
            --line: #e3e3e0;
            --hover: #f1f1ee;
            --accent: #2f5bd3;
            --bad: #c62828;
            --good: #2e7d32;
            --warn-bg: #fdecea;
            --warn-text: #8a1c1c;
            --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #141416;
                --panel: #1c1c1f;
                --text: #ececef;
                --muted: #98989f;
                --line: #2c2c31;
                --hover: #24242a;
                --accent: #7c9cff;
                --bad: #ff6b6b;
                --good: #6fcf73;
                --warn-bg: #3a1d1d;
                --warn-text: #ffb4b4;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 20px;
            padding: 14px 20px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
        }

        .brand {
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.02em;
        }

        .target {
            min-width: 0;
            font-family: var(--mono);
            color: var(--muted);
            overflow-wrap: anywhere;
        }

        nav {
            display: flex;
            gap: 14px;
        }

        nav:empty {
            display: none;
        }

        nav a {
            color: var(--accent);
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 18px;
            margin-left: auto;
            align-items: center;
        }

        .stat b {
            font-variant-numeric: tabular-nums;
        }

        button {
            font: inherit;
            padding: 4px 10px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--panel);
            color: var(--accent);
            cursor: pointer;
        }

        button:hover {
            background: var(--hover);
        }

        button:disabled {
            color: var(--muted);
            cursor: default;
        }

        .note {
            color: var(--bad);
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .banner {
            display: none;
            margin: 12px 20px 0;
            padding: 10px 14px;
            border-radius: 8px;
            background: var(--warn-bg);
            color: var(--warn-text);
            overflow-wrap: anywhere;
        }

        .banner.on {
            display: block;
        }

        .summary {
            margin: 0 0 12px;
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            overflow-wrap: anywhere;
        }

        a.button {
            font: inherit;
            padding: 4px 10px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--panel);
            color: var(--accent);
            text-decoration: none;
        }

        a.button:hover {
            background: var(--hover);
        }

        .banner.info {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--line);
        }

        main {
            padding: 16px 20px 40px;
        }

        .wrap {
            overflow-x: auto;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
        }

        th {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }

        td.num, th.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        tr.row {
            cursor: pointer;
            outline: none;
        }

        tr.row:hover td {
            background: var(--hover);
        }

        tr.row:focus-visible td {
            background: var(--hover);
            box-shadow: inset 0 2px 0 var(--accent), inset 0 -2px 0 var(--accent);
        }

        tr.row:focus-visible td:first-child {
            box-shadow: inset 2px 0 0 var(--accent), inset 0 2px 0 var(--accent), inset 0 -2px 0 var(--accent);
        }

        tr.row:focus-visible td:last-child {
            box-shadow: inset -2px 0 0 var(--accent), inset 0 2px 0 var(--accent), inset 0 -2px 0 var(--accent);
        }

        .site {
            font-family: var(--mono);
            font-size: 13px;
            word-break: break-all;
        }

        .entry {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--muted);
            word-break: break-all;
        }

        .bad {
            color: var(--bad);
            font-weight: 600;
        }

        .good {
            color: var(--good);
        }

        .dim {
            color: var(--muted);
        }

        tr.detail td {
            background: var(--hover);
        }

        tr.more td {
            text-align: center;
        }

        .stack {
            margin: 0;
            padding: 0;
            list-style: none;
            font-family: var(--mono);
            font-size: 12px;
        }

        .stack li {
            padding: 1px 0;
            word-break: break-all;
        }

        .created {
            margin-top: 6px;
            font-size: 12px;
            color: var(--muted);
        }

        .empty {
            padding: 40px;
            text-align: center;
            color: var(--muted);
        }
    </style>
</head>
<body>
<header>
    <span class="brand">ruvo</span>
    <span class="target" id="target"></span>
    <nav id="views"></nav>
    <div class="stats">
        <span class="stat"><b id="count">—</b> goroutines</span>
        <span class="stat dim" id="updated">connecting…</span>
        <span class="stat"><span id="full">full dump: never</span> <button id="fullBtn" type="button">Full dump</button></span>
        <span class="stat"><span id="leaks">leaks: never</span> <button id="leaksBtn" type="button">Find leaks</button></span>
        <span class="stat"><a class="button" id="export" href="api/export" download title="Save what this page shows, with the dumps and the trace behind it, as a zip file; open it again with ruvo -open">Export</a></span>
        <span class="note" id="note"></span>
    </div>
</header>
<div class="banner" id="banner"></div>
<main>
    <p class="summary" id="summary" hidden></p>
    <div class="wrap">
        <table>
            <thead>
            <tr>
                <th>Where they wait</th>
                <th class="num">Goroutines</th>
                <th class="num">Waiting</th>
                <th class="num">Growth/min</th>
                <th class="num">Leaked</th>
                <th>State</th>
            </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty">Waiting for the first snapshot…</div>
    </div>
</main>
<script>
    const $ = (id) => document.getElementById(id);
    const open = new Set();
    const page = 200;
    let shown = page;
    let snap = null;
    let received = 0;
    let fresh = 0;
    let lost = false;
    let poller = null;

    function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
    }

    function ago(ms) {
        const s = Math.max(0, Math.round(ms / 1000));
        if (s < 60) return s + "s ago";
        const m = Math.floor(s / 60);
        if (m < 60) return m + "m ago";
        return Math.floor(m / 60) + "h " + (m % 60) + "m ago";
    }

    function since(at) {
        if (!at || !snap) return null;
        return Date.parse(snap.at) - Date.parse(at) + (snap.offline ? 0 : Date.now() - received);
    }

    function count(v) {
        return typeof v === "number" ? v.toLocaleString("en-US") : "—";
    }

    function wait(g) {
        if (!g.inFullDump) return "—";
        const m = Math.floor(g.maxWait / 6e10);
        if (m < 1) return "<1m";
        if (m < 60) return m + "m";
        return Math.floor(m / 60) + "h " + (m % 60) + "m";
    }

    function growth(td, v) {
        if (!v) {
            td.textContent = "—";
            td.classList.add("dim");
            return;
        }
        const a = Math.abs(v);
        const n = a >= 10 ? Math.round(a).toString() : a.toFixed(1);
        td.textContent = (v > 0 ? "+" : "−") + n;
        td.classList.add(v > 0 ? "bad" : "good");
    }

    function banner() {
        if (lost) return "Lost connection to ruvo — retrying…";
        if (!snap) return "";
        if (snap.offline) return "Opened from a file: this is what ruvo saw at " + new Date(snap.at).toLocaleString() + ". Nothing reads the target, so the actions are off." + (snap.error ? " The last read before the file was saved failed (" + snap.error + "): the groups are the last data read before that." : "");
        if (snap.error) return "Cannot read the target: " + snap.error;
        const quiet = Date.now() - fresh;
        if (quiet > Math.max(3 * snap.interval / 1e6, 15000)) return "No new data for " + ago(quiet).replace(" ago", "") + ".";
        return "";
    }

    function header() {
        const text = banner();
        const b = $("banner");
        b.textContent = text;
        b.classList.toggle("on", text !== "");
        b.classList.toggle("info", !lost && !!(snap && snap.offline && !snap.error));
        if (!snap) return;
        $("target").textContent = snap.target;
        $("count").textContent = count(snap.goroutines);
        $("updated").textContent = snap.offline ? "taken " + new Date(snap.at).toLocaleString() : "updated " + ago(Date.now() - fresh);
        if (snap.offline) $("fullBtn").disabled = $("leaksBtn").disabled = true;
        const f = since(snap.fullAt);
        const cut = snap.fullCut === true;
        $("full").textContent = "full dump: " + (f === null ? "never" : ago(f)) + (cut ? " · " + count(snap.fullCount) + " of " + count(snap.goroutines) : "");
        if (cut) $("full").title = "The full dump was cut at 64 MB; state and wait times cover only these goroutines.";
        else $("full").removeAttribute("title");
        const l = since(snap.leaksAt);
        $("leaks").textContent = "leaks: " + (l === null ? "never" : ago(l));
        document.title = "ruvo · " + snap.target;
    }

    function summary() {
        const groups = (snap && snap.groups) || [];
        const most = (key, mine) => groups.filter((g) => g[key] > 0 && (!mine || !g.std)).sort((a, b) => b[key] - a[key])[0];
        const rate = (v) => "+" + (Math.abs(v) >= 10 ? Math.round(Math.abs(v)) : Math.abs(v).toFixed(1)) + "/min";
        const out = [];
        const told = new Set();
        const leaked = most("leaked");
        if (leaked) {
            out.push(leaked.waitSite + ": " + count(leaked.leaked) + " goroutines blocked forever" + (leaked.growthPerMin > 0 ? ", growing " + rate(leaked.growthPerMin) : "") + ".");
            told.add(leaked.id);
        }
        const growing = most("growthPerMin");
        if (growing && !told.has(growing.id)) {
            out.push(growing.waitSite + " grows " + rate(growing.growthPerMin) + ".");
            told.add(growing.id);
        }
        const stuck = most("unwoken", true);
        if (stuck && !told.has(stuck.id)) out.push(stuck.waitSite + ": " + count(stuck.unwoken) + " goroutines slept through the whole trace — nothing woke them.");
        return out.join(" ");
    }

    function render() {
        header();
        const text = summary();
        $("summary").textContent = text;
        $("summary").hidden = !text;
        const body = $("rows");
        const focused = document.activeElement;
        const keep = focused && body.contains(focused) ? focused.dataset.id : null;
        let refocus = null;
        body.replaceChildren();
        const groups = (snap && snap.groups) || [];
        $("empty").style.display = groups.length ? "none" : "block";
        for (const g of groups.slice(0, shown)) {
            const tr = el("tr", "row");
            tr.tabIndex = 0;
            tr.dataset.id = g.id;
            tr.setAttribute("role", "button");
            tr.setAttribute("aria-expanded", open.has(g.id) ? "true" : "false");
            const where = el("td");
            where.append(el("div", "site", g.waitSite));
            if (g.entry && !g.waitSite.startsWith(g.entry + " ")) where.append(el("div", "entry", g.entry));
            tr.append(where);
            tr.append(el("td", "num", g.count));
            tr.append(el("td", "num", wait(g)));
            const gr = el("td", "num");
            growth(gr, g.growthPerMin);
            tr.append(gr);
            tr.append(el("td", "num" + (g.leaked ? " bad" : " dim"), g.leaked ? g.leaked : "—"));
            tr.append(el("td", g.state ? "" : "dim", g.state || "—"));
            tr.onclick = () => flip(g.id);
            tr.onkeydown = (ev) => {
                if (ev.key !== "Enter" && ev.key !== " ") return;
                ev.preventDefault();
                if (!ev.repeat) flip(g.id);
            };
            if (g.id === keep) refocus = tr;
            body.append(tr);
            if (open.has(g.id)) body.append(detail(g));
        }
        if (groups.length > shown) body.append(more(groups.length));
        if (refocus) refocus.focus({preventScroll: true});
    }

    function more(total) {
        const tr = el("tr", "more");
        const td = el("td");
        td.colSpan = 6;
        const btn = el("button", "", "Show " + count(Math.min(page, total - shown)) + " more");
        btn.type = "button";
        btn.onclick = () => {
            shown += page;
            render();
        };
        td.append(el("span", "dim", count(shown) + " of " + count(total) + " groups, the largest first. "), btn);
        tr.append(td);
        return tr;
    }

    function flip(id) {
        open.has(id) ? open.delete(id) : open.add(id);
        render();
    }

    function detail(g) {
        const tr = el("tr", "detail");
        const td = el("td");
        td.colSpan = 6;
        const ul = el("ul", "stack");
        for (const f of g.stack || []) ul.append(el("li", "", f));
        td.append(ul);
        if (g.createdBy) td.append(el("div", "created", "created by " + g.createdBy));
        if (g.labels && g.labels.length) {
            td.append(el("div", "created", "by pprof labels"));
            const lu = el("ul", "stack");
            for (const l of g.labels) lu.append(el("li", "", labelText(l)));
            td.append(lu);
        }
        tr.append(td);
        return tr;
    }

    function labelText(l) {
        const labels = l.labels || {};
        return Object.keys(labels).sort().map((k) => k + "=" + labels[k]).join(" ") + " ×" + l.count;
    }

    function show(s) {
        if (snap && s.seq < snap.seq) return;
        if (!snap || s.seq !== snap.seq) fresh = Date.now();
        snap = s;
        received = Date.now();
        lost = false;
        render();
    }

    function disconnected() {
        lost = true;
        header();
    }

    async function poll() {
        try {
            const r = await fetch("api/snapshot");
            if (r.ok) show(await r.json());
            else disconnected();
        } catch (e) {
            disconnected();
        }
    }

    let stacks = new Map();

    function remember(s) {
        stacks = new Map((s.groups || []).map((g) => [g.id, g.stack || []]));
        return s;
    }

    function fill(s) {
        const next = new Map();
        for (const g of s.groups || []) {
            const stack = g.stack || stacks.get(g.id);
            if (!stack) return null;
            next.set(g.id, stack);
        }
        stacks = next;
        for (const g of s.groups || []) g.stack = next.get(g.id);
        return s;
    }

    function connect() {
        const es = new EventSource("api/events?lean=1");
        const got = (s) => {
            if (poller) {
                clearInterval(poller);
                poller = null;
            }
            show(s);
        };
        es.addEventListener("snapshot", (e) => got(remember(JSON.parse(e.data))));
        es.addEventListener("update", (e) => {
            const s = fill(JSON.parse(e.data));
            if (s) return got(s);
            es.close();
            connect();
        });
        es.onerror = () => {
            disconnected();
            if (!poller) poller = setInterval(poll, 5000);
        };
    }

    async function act(path, btn) {
        btn.disabled = true;
        $("note").textContent = "";
        try {
            const r = await fetch(path, {method: "POST"});
            if (r.ok) show(await r.json());
            else $("note").textContent = (await r.text()).trim();
        } catch (e) {
            $("note").textContent = String(e);
        }
        btn.disabled = false;
    }

    $("fullBtn").onclick = () => act("api/full", $("fullBtn"));
    $("leaksBtn").onclick = () => act("api/leaks", $("leaksBtn"));
    setInterval(header, 1000);
    connect();
</script>
</body>
</html>
